- defaults:
    link:
      relink: true
    shell:
      stdout: true
      stderr: true

- clean:
    ~/:
      force: true
    ~/.config:
      recursive: true
    # Drop links to skills that have since left agents/. Unforced, so a skill
    # installed by some other route survives.
    ~/.claude/skills:
    ~/.agents/skills:

- create:
    - ~/.dotbot-git
    # Machine-local commit identities. Contents are never tracked here.
    - ~/.config/git/identities

- brewfile:
    - Brewfile

# Git
# .gitconfig ends with an include of ~/.config/git/local.gitconfig, which is
# NOT in this repo and NOT linked from here: it is where machine-local config
# lives, including any extra commit identities. Nothing to install -- git
# treats a missing include path as a no-op.
- link:
    ~/.gitconfig:
      path: .gitconfig
      force: true
      create: true

# SSH
# Runs after the Brewfile has installed Secretive. The agent socket still will
# not exist until Secretive.app has been launched and a key created, which is
# why ssh/config guards the IdentityAgent line on the socket being there.
# force: true replaces an existing ~/.ssh/config -- check before re-running on
# a machine that already has one.
- shell:
    - [mkdir -p ~/.ssh && chmod 700 ~/.ssh, Ensure ~/.ssh exists with safe permissions]
- link:
    ~/.ssh/config:
      path: ssh/config
      force: true
      create: true

# Powerline fonts
- git:
    ~/.dotbot-git/fonts:
        url: https://github.com/powerline/fonts.git
        description: Powerline fonts

- shell:
  - [cd ~/.dotbot-git/fonts && ./install.sh, "Install Powerline fonts"]

# Install Zsh and Oh My Zsh
- shell:
  - ['[ ! -f ~/.zshrc ] || cp ~/.zshrc ~/.zshrc.bak', Backup existing .zshrc if there is one]
- link:
    ~/.zshrc:
      path: zsh/.zshrc.oh-my-zsh
      force: true
    ~/.zshrc.custom:
      path: zsh/.zshrc.custom
      force: true

## Oh My Zsh
- shell:
  - [rm -rf ~/.oh-my-zsh, Remove Oh My Zsh]
- git:
    ~/.oh-my-zsh:
        url: https://github.com/ohmyzsh/ohmyzsh.git
        description: Oh My Zsh
- git:
    ~/.config/oh-my-zsh/custom/plugins/zsh-syntax-highlighting:
        url: https://github.com/zsh-users/zsh-syntax-highlighting.git
    ~/.config/oh-my-zsh/custom/plugins/zsh-autosuggestions:
        url: https://github.com/zsh-users/zsh-autosuggestions.git
- link:
    ~/.config/oh-my-zsh/custom/aliases.zsh:
      path: zsh/custom/aliases.zsh
      create: true
      force: true


# Karabiner elements config
# Karabiner doesn't like direct linking of config file, instead we should symlink a directory
- link:
    ~/.config/karabiner:
      path: karabiner
      force: true
      create: true


# Agents: global instructions + skills
# Claude Code and Codex read the same SKILL.md format and the same kind of
# global instructions file, just from different paths. One copy lives in
# agents/, and these links point both agents at it. See AGENTS.md.

# One instructions file, both agents. Claude Code reads CLAUDE.md and not
# AGENTS.md, so the shared file is linked under each name.
- link:
    ~/.claude/CLAUDE.md:
      path: agents/global.md
      create: true
    ~/.codex/AGENTS.md:
      path: agents/global.md
      create: true

# Skills you wrote. Globbed, so a new directory under agents/skills/ needs no
# edit here.
- link:
    ~/.claude/skills/:
      path: agents/skills/*
      glob: true
      create: true
    ~/.agents/skills/:
      path: agents/skills/*
      glob: true
      create: true

# Skills from anthropics/skills, a submodule under agents/vendor/. Listed one
# at a time on purpose: the submodule carries 19, and each one linked here puts
# its description in every session's skill listing and gives the model one more
# thing it might invoke on its own. This is the opt-in list. Bump them all with
# `git submodule update --remote agents/vendor/anthropics-skills`.
- link:
    ~/.claude/skills/frontend-design:
      path: agents/vendor/anthropics-skills/skills/frontend-design
      create: true
    ~/.agents/skills/frontend-design:
      path: agents/vendor/anthropics-skills/skills/frontend-design
      create: true

# OS X
# NOT under sudo: `defaults write` targets the effective user's preference
# domain, so running this as root wrote every setting into /var/root and the
# logged-in account never saw them. The script elevates the two commands that
# genuinely need root (pmset) on its own.
# stdin is required so sudo/sysadminctl password prompts can reach the terminal.
- shell:
    - command: macos/set-defaults.sh
      description: Setting up macOS defaults
      stdin: true
      stdout: true
      stderr: true

# Commit signing
# Provisions ~/.ssh/git-signing.pub from the agent and reports whether
# SecretAgent can post notifications. Best-effort and advisory: Secretive keys
# cannot exist before the app has been launched and keys created, so on a first
# run this prints what is still missing rather than failing. Runs after
# set-defaults.sh so its warnings land near the other security warnings.
- shell:
    - command: macos/setup-signing.sh
      description: Setting up commit signing
      stdout: true
      stderr: true

# Follow ups
- shell:
    - command: |
        echo ""
        echo "  Commit signing is ON, so 'git commit' fails until"
        echo "  ~/.ssh/git-signing.pub exists. Two Secretive keys are needed."
        echo ""
        echo "  1. create a key with 'Require Authentication'. This is the"
        echo "     SSH auth key. Add it to GitHub as an AUTHENTICATION key."
        echo ""
        echo "  2. create a second key with 'Notify' instead. This one signs"
        echo "     commits. Add it to GitHub as a SIGNING key -- that is a"
        echo "     separate list, and a key in only the Authentication list"
        echo "     signs fine but never shows a Verified badge."
        echo ""
        echo "     Two keys because signing hits the Secure Enclave once per"
        echo "     commit, and ControlMaster cannot amortise that the way it"
        echo "     does for pushes. A single auth-required key would mean a"
        echo "     Touch ID tap on every commit."
        echo ""
        echo "  3. allow notifications for SecretAgent when asked. With the"
        echo "     signing key on Notify, that banner is the only sign the"
        echo "     key was used at all."
        echo ""
        echo "  4. re-run:  macos/setup-signing.sh"
        echo "     It identifies the signing key by matching the agent"
        echo "     against the signing keys registered on your GitHub"
        echo "     account, and writes ~/.ssh/git-signing.pub itself."
        echo "     Nothing needs copying by hand."
        echo ""
        echo "  5. verify by behaviour, not by assumption:"
        echo "       ssh -T git@github.com"
        echo "       git commit --allow-empty -m 'signing test'"
        echo "     That commit should not ask for Touch ID, should raise a"
        echo "     notification, and should show Verified on GitHub."
        echo ""
      description: Next steps
      stdout: true
    - [echo "You're done!"]
